name: Bootstrap Server
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_IP: ${{ vars.SERVER_IP }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

      - name: Install ansible-core + community.docker
        run: |
          pip install --quiet ansible-core
          ansible-galaxy collection install community.docker

      - name: Run bootstrap
        env:
          CERT_EMAIL: ${{ vars.CERT_EMAIL }}
          HEALTHCHECKS_URL: ${{ vars.HEALTHCHECKS_URL }}
          KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: >
          ansible-playbook -i "${SERVER_IP},"
          -u ubuntu --private-key ~/.ssh/id_deploy bootstrap.yml